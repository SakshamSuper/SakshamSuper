<svg xmlns="http://www.w3.org/2000/svg" width="888" height="250" viewBox="0 0 888 250" font-family="-apple-system,BlinkMacSystemFont,'JetBrains Mono','Segoe UI',sans-serif">
  <defs>
    <linearGradient id="a-bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#070c18"/>
      <stop offset="100%" stop-color="#030509"/>
    </linearGradient>
    <linearGradient id="a-hdr" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#090d16"/>
    </linearGradient>
    <linearGradient id="a-gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a1200"/>
      <stop offset="100%" stop-color="#0d0a04"/>
    </linearGradient>
    <linearGradient id="a-cyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#051828"/>
      <stop offset="100%" stop-color="#030c14"/>
    </linearGradient>
    <linearGradient id="a-grn" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#051a10"/>
      <stop offset="100%" stop-color="#030c08"/>
    </linearGradient>
    <linearGradient id="bar-g" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#fbbf24"/>
    </linearGradient>
    <linearGradient id="bar-c" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0ea5e9"/>
      <stop offset="100%" stop-color="#00D4FF"/>
    </linearGradient>
    <linearGradient id="bar-e" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <linearGradient id="a-bdr" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(0,212,255,0.4)"/>
      <stop offset="100%" stop-color="rgba(139,92,246,0.2)"/>
    </linearGradient>
    <clipPath id="a-clip"><rect width="888" height="250" rx="10"/></clipPath>
  </defs>
  <style>
    .bgrow { animation: bgrow 1.5s 0.3s ease-out both; transform-box: fill-box; transform-origin: left center; }
    .bgrow2 { animation: bgrow 1.5s 0.5s ease-out both; transform-box: fill-box; transform-origin: left center; }
    .bgrow3 { animation: bgrow 1.5s 0.7s ease-out both; transform-box: fill-box; transform-origin: left center; }
    @keyframes bgrow { from { transform: scaleX(0); } to { transform: scaleX(1); } }
    .pdot { animation: pdot 2s ease-in-out infinite; }
    @keyframes pdot { 0%,100%{opacity:1;} 50%{opacity:0.3;} }
  </style>

  <g clip-path="url(#a-clip)">
    <!-- BG -->
    <rect width="888" height="250" fill="url(#a-bg)"/>
    <rect x="0.5" y="0.5" width="887" height="249" fill="none" stroke="url(#a-bdr)" stroke-width="1.2" rx="10"/>
    <!-- Title Bar -->
    <rect width="888" height="34" fill="url(#a-hdr)"/>
    <line x1="0" y1="34" x2="888" y2="34" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
    <circle cx="18" cy="17" r="4.5" fill="#ff5f56"/>
    <circle cx="32" cy="17" r="4.5" fill="#ffbd2e"/>
    <circle cx="46" cy="17" r="4.5" fill="#27c93f"/>
    <circle class="pdot" cx="860" cy="17" r="4" fill="#10b981"/>
    <text x="444" y="21" text-anchor="middle" font-family="'JetBrains Mono',monospace" font-size="11.5" fill="#8892A4">console // achievements --visualize</text>

    <!-- ═══ CARD 1: 1st Place Zero to One ═══ -->
    <g transform="translate(20,46)">
      <rect width="273" height="186" rx="8" fill="url(#a-gold)"/>
      <rect width="273" height="186" rx="8" fill="none" stroke="#fbbf24" stroke-width="1.3" stroke-opacity="0.6"/>
      <!-- top accent bar -->
      <rect width="273" height="3" rx="1.5" fill="url(#bar-g)"/>
      <!-- icon + badge -->
      <text x="14" y="31" font-size="22">🏆</text>
      <rect x="150" y="12" width="108" height="20" rx="10" fill="#201500" stroke="#fbbf24" stroke-width="1"/>
      <text x="204" y="26" text-anchor="middle" font-family="'JetBrains Mono',monospace" font-size="9.5" font-weight="700" fill="#fbbf24">1st PLACE WINNER</text>
      <!-- title -->
      <text x="14" y="62" font-size="13.5" font-weight="bold" fill="#F8FAFC">Zero to One Hackathon</text>
      <text x="14" y="80" font-size="11" fill="#94A3B8">Chandigarh University · 2024</text>
      <line x1="14" y1="90" x2="258" y2="90" stroke="rgba(251,191,36,0.2)" stroke-width="1"/>
      <!-- metric 1 -->
      <text x="14" y="108" font-family="'JetBrains Mono',monospace" font-size="10" fill="#94A3B8">Teams Outperformed</text>
      <text x="258" y="108" text-anchor="end" font-family="'JetBrains Mono',monospace" font-size="10" font-weight="700" fill="#fbbf24">600+</text>
      <rect x="14" y="113" width="244" height="6" rx="3" fill="#1a1200"/>
      <rect class="bgrow" x="14" y="113" width="244" height="6" rx="3" fill="url(#bar-g)"/>
      <!-- metric 2 -->
      <text x="14" y="136" font-family="'JetBrains Mono',monospace" font-size="10" fill="#94A3B8">Competition Rank</text>
      <text x="258" y="136" text-anchor="end" font-family="'JetBrains Mono',monospace" font-size="10" font-weight="700" fill="#fbbf24">1 / 600</text>
      <rect x="14" y="141" width="244" height="6" rx="3" fill="#1a1200"/>
      <rect class="bgrow" x="14" y="141" width="244" height="6" rx="3" fill="url(#bar-g)"/>
      <!-- tags -->
      <rect x="14" y="160" width="80" height="18" rx="9" fill="#2d1f00"/>
      <text x="54" y="173" text-anchor="middle" font-family="'JetBrains Mono',monospace" font-size="9" fill="#f59e0b">Top 0.16%</text>
      <rect x="102" y="160" width="88" height="18" rx="9" fill="#1a1200"/>
      <text x="146" y="173" text-anchor="middle" font-family="'JetBrains Mono',monospace" font-size="9" fill="#fbbf24">AI · Innovation</text>
    </g>

    <!-- ═══ CARD 2: HackLLM ═══ -->
    <g transform="translate(307,46)">
      <rect width="273" height="186" rx="8" fill="url(#a-cyan)"/>
      <rect width="273" height="186" rx="8" fill="none" stroke="#00D4FF" stroke-width="1.3" stroke-opacity="0.6"/>
      <rect width="273" height="3" rx="1.5" fill="url(#bar-c)"/>
      <text x="14" y="31" font-size="22">🥈</text>
      <rect x="150" y="12" width="108" height="20" rx="10" fill="#031c2e" stroke="#00D4FF" stroke-width="1"/>
      <text x="204" y="26" text-anchor="middle" font-family="'JetBrains Mono',monospace" font-size="9.5" font-weight="700" fill="#00D4FF">RUNNER-UP AWARD</text>
      <text x="14" y="62" font-size="13.5" font-weight="bold" fill="#F8FAFC">HackLLM Hackathon</text>
      <text x="14" y="80" font-size="11" fill="#94A3B8">IIIT Delhi · LLM Agent Track</text>
      <line x1="14" y1="90" x2="258" y2="90" stroke="rgba(0,212,255,0.2)" stroke-width="1"/>
      <text x="14" y="108" font-family="'JetBrains Mono',monospace" font-size="10" fill="#94A3B8">Agent Benchmark Score</text>
      <text x="258" y="108" text-anchor="end" font-family="'JetBrains Mono',monospace" font-size="10" font-weight="700" fill="#00D4FF">96/100</text>
      <rect x="14" y="113" width="244" height="6" rx="3" fill="#031c2e"/>
      <rect class="bgrow2" x="14" y="113" width="236" height="6" rx="3" fill="url(#bar-c)"/>
      <text x="14" y="136" font-family="'JetBrains Mono',monospace" font-size="10" fill="#94A3B8">Leaderboard Position</text>
      <text x="258" y="136" text-anchor="end" font-family="'JetBrains Mono',monospace" font-size="10" font-weight="700" fill="#00D4FF">Top 2</text>
      <rect x="14" y="141" width="244" height="6" rx="3" fill="#031c2e"/>
      <rect class="bgrow2" x="14" y="141" width="230" height="6" rx="3" fill="url(#bar-c)"/>
      <rect x="14" y="160" width="88" height="18" rx="9" fill="#031824"/>
      <text x="58" y="173" text-anchor="middle" font-family="'JetBrains Mono',monospace" font-size="9" fill="#38bdf8">LLM Agents</text>
      <rect x="110" y="160" width="88" height="18" rx="9" fill="#031824"/>
      <text x="154" y="173" text-anchor="middle" font-family="'JetBrains Mono',monospace" font-size="9" fill="#00D4FF">RAG · Tool Use</text>
    </g>

    <!-- ═══ CARD 3: 5x Certifications ═══ -->
    <g transform="translate(594,46)">
      <rect width="273" height="186" rx="8" fill="url(#a-grn)"/>
      <rect width="273" height="186" rx="8" fill="none" stroke="#10b981" stroke-width="1.3" stroke-opacity="0.6"/>
      <rect width="273" height="3" rx="1.5" fill="url(#bar-e)"/>
      <text x="14" y="31" font-size="22">🎓</text>
      <rect x="150" y="12" width="108" height="20" rx="10" fill="#03260f" stroke="#10b981" stroke-width="1"/>
      <text x="204" y="26" text-anchor="middle" font-family="'JetBrains Mono',monospace" font-size="9.5" font-weight="700" fill="#10b981">5× CERTIFIED</text>
      <text x="14" y="62" font-size="13.5" font-weight="bold" fill="#F8FAFC">Cloud &amp; AI Credentials</text>
      <text x="14" y="80" font-size="11" fill="#94A3B8">Microsoft · Oracle · Postman</text>
      <line x1="14" y1="90" x2="258" y2="90" stroke="rgba(16,185,129,0.2)" stroke-width="1"/>
      <!-- cert pills 2x2 grid -->
      <rect x="14" y="98" width="116" height="17" rx="8" fill="#061c10" stroke="rgba(16,185,129,0.4)" stroke-width="1"/>
      <text x="72" y="110" text-anchor="middle" font-family="'JetBrains Mono',monospace" font-size="9" fill="#34d399">Azure AI-102</text>
      <rect x="136" y="98" width="116" height="17" rx="8" fill="#061c10" stroke="rgba(16,185,129,0.4)" stroke-width="1"/>
      <text x="194" y="110" text-anchor="middle" font-family="'JetBrains Mono',monospace" font-size="9" fill="#34d399">Azure DP-100</text>
      <rect x="14" y="120" width="116" height="17" rx="8" fill="#061c10" stroke="rgba(16,185,129,0.3)" stroke-width="1"/>
      <text x="72" y="132" text-anchor="middle" font-family="'JetBrains Mono',monospace" font-size="9" fill="#6ee7b7">Fabric DP-600</text>
      <rect x="136" y="120" width="116" height="17" rx="8" fill="#061c10" stroke="rgba(16,185,129,0.3)" stroke-width="1"/>
      <text x="194" y="132" text-anchor="middle" font-family="'JetBrains Mono',monospace" font-size="9" fill="#6ee7b7">Oracle OCI</text>
      <!-- full-width postman pill -->
      <rect x="14" y="142" width="244" height="17" rx="8" fill="#0d0a1e" stroke="rgba(139,92,246,0.45)" stroke-width="1"/>
      <text x="136" y="154" text-anchor="middle" font-family="'JetBrains Mono',monospace" font-size="9" fill="#a78bfa">Postman Student Expert</text>
      <!-- pass rate bar -->
      <text x="14" y="174" font-family="'JetBrains Mono',monospace" font-size="9.5" fill="#94A3B8">Industry Exam Pass Rate</text>
      <text x="258" y="174" text-anchor="end" font-family="'JetBrains Mono',monospace" font-size="9.5" font-weight="700" fill="#10b981">100%</text>
      <rect x="14" y="178" width="244" height="4" rx="2" fill="#051a10"/>
      <rect class="bgrow3" x="14" y="178" width="244" height="4" rx="2" fill="url(#bar-e)"/>
    </g>
  </g>
</svg>
