      <text x="14" y="80" font-size="11" fill="#94A3B8">Microsoft · Oracle · Postman</text>
      <line x1="14" y1="92" x2="258" y2="92" stroke="rgba(16,185,129,0.2)" stroke-width="1"/>
      <rect x="14" y="100" width="116" height="17" rx="8" fill="#061c10" stroke="rgba(16,185,129,0.4)" stroke-width="1"/>
      <text x="72" y="112" text-anchor="middle" font-family="'JetBrains Mono',monospace" font-size="9" fill="#34d399">Azure AI-102</text>
      <rect x="136" y="100" width="116" height="17" rx="8" fill="#061c10" stroke="rgba(16,185,129,0.4)" stroke-width="1"/>
      <text x="194" y="112" text-anchor="middle" font-family="'JetBrains Mono',monospace" font-size="9" fill="#34d399">Azure DP-100</text>
      <rect x="14" y="122" width="116" height="17" rx="8" fill="#061c10" stroke="rgba(16,185,129,0.3)" stroke-width="1"/>
      <text x="72" y="134" text-anchor="middle" font-family="'JetBrains Mono',monospace" font-size="9" fill="#6ee7b7">Fabric DP-600</text>
      <rect x="136" y="122" width="116" height="17" rx="8" fill="#061c10" stroke="rgba(16,185,129,0.3)" stroke-width="1"/>
      <text x="194" y="134" text-anchor="middle" font-family="'JetBrains Mono',monospace" font-size="9" fill="#6ee7b7">Oracle OCI</text>
      <rect x="14" y="144" width="244" height="17" rx="8" fill="#03260f" stroke="rgba(139,92,246,0.4)" stroke-width="1"/>
      <text x="136" y="156" text-anchor="middle" font-family="'JetBrains Mono',monospace" font-size="9" fill="#a78bfa">Postman Student Expert</text>
      <text x="14" y="176" font-family="'JetBrains Mono',monospace" font-size="9.5" fill="#94A3B8">Industry Exam Pass Rate</text>
      <text x="258" y="176" text-anchor="end" font-family="'JetBrains Mono',monospace" font-size="9.5" font-weight="700" fill="#10b981">100%</text>
      <rect x="14" y="180" width="244" height="4" rx="2" fill="#051a10"/>
      <rect class="bar-grn" x="14" y="180" width="244" height="4" rx="2" fill="url(#green-bar2)"/>
