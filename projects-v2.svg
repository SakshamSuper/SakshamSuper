<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 920 490" width="920" height="490">
  <defs>
    <linearGradient id="p-bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#070b15"/>
      <stop offset="100%" stop-color="#030509"/>
    </linearGradient>
    <linearGradient id="p-hdr" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#070b14"/>
    </linearGradient>
    <linearGradient id="p-bdr" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(0,212,255,0.4)"/>
      <stop offset="100%" stop-color="rgba(139,92,246,0.25)"/>
    </linearGradient>
    <linearGradient id="row-hover" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="rgba(0,212,255,0.08)"/>
      <stop offset="100%" stop-color="rgba(0,212,255,0.02)"/>
    </linearGradient>
    <clipPath id="p-clip"><rect width="920" height="490" rx="12"/></clipPath>
  </defs>
  <style>
    .row:hover .rbg { fill: rgba(0,212,255,0.1); stroke: rgba(0,212,255,0.5); }
    .row:hover .rname { fill: #00D4FF; }
    .row:hover .arrow { opacity: 1; fill: #00D4FF; }
    .pdot { animation: pd 2s ease-in-out infinite; }
    @keyframes pd { 0%,100%{opacity:1;} 50%{opacity:0.25;} }
  </style>

  <g clip-path="url(#p-clip)">
