<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 888 400" width="888" height="400">
  <defs>
    <linearGradient id="p-bg" x1="0%" y1="0%" x2="0%" y2="100%">
