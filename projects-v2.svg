<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 888 340" width="888" height="340">
  <style>
    .row:hover .rbg { fill: rgba(0,212,255,0.09); stroke: rgba(0,212,255,0.45); }
    .row:hover .rname { fill: #00D4FF; }
    .row:hover .arrow { fill: #00D4FF; }
  </style>
  <defs>
    <linearGradient id="pbg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#070b15"/>
      <stop offset="100%" stop-color="#030509"/>
    </linearGradient>
    <linearGradient id="phdr" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#070b14"/>
    </linearGradient>
    <linearGradient id="pborder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(0,212,255,0.35)"/>
      <stop offset="100%" stop-color="rgba(139,92,246,0.2)"/>
    </linearGradient>
    <clipPath id="pclip"><rect width="888" height="340" rx="10"/></clipPath>
  </defs>
  <g clip-path="url(#pclip)">
    <rect width="888" height="340" fill="url(#pbg)"/>
    <rect x="0.5" y="0.5" width="887" height="339" fill="none" stroke="url(#pborder)" stroke-width="1.2" rx="10"/>
    <!-- Title Bar -->
    <rect width="888" height="34" fill="url(#phdr)"/>
    <line x1="0" y1="34" x2="888" y2="34" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
    <circle cx="18" cy="17" r="4.5" fill="#ff5f56"/>
    <circle cx="32" cy="17" r="4.5" fill="#ffbd2e"/>
    <circle cx="46" cy="17" r="4.5" fill="#27c93f"/>
    <text x="444" y="21" text-anchor="middle" font-family="'JetBrains Mono',monospace" font-size="11.5" fill="#8892A4">console // projects --click-to-open --featured</text>
    <!-- Prompt line -->
    <text x="25" y="58" font-family="'JetBrains Mono',monospace" font-size="13" font-weight="bold" fill="#E2E8F0">
      <tspan fill="#00D4FF">❯ </tspan>ls ~/projects --sort=stars
      <tspan font-size="10.5" font-weight="normal" fill="#64748B">  // Click any row to open →</tspan>
    </text>
    <!-- Column headers -->
    <text x="25" y="76" font-family="'JetBrains Mono',monospace" font-size="9.5" fill="#374151">NAME</text>
    <text x="295" y="76" font-family="'JetBrains Mono',monospace" font-size="9.5" fill="#374151">DESCRIPTION</text>
    <text x="650" y="76" font-family="'JetBrains Mono',monospace" font-size="9.5" fill="#374151">STACK</text>
    <line x1="18" y1="80" x2="870" y2="80" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>

    <!-- Project 1 -->
    <a href="https://github.com/SakshamSuper/POSTURE-ANALYSIS-SYSTEM" target="_blank" class="row">
      <rect class="rbg" x="18" y="84" width="852" height="38" rx="6" fill="#07101e" fill-opacity="0.7" stroke="rgba(255,255,255,0.05)" stroke-width="1"/>
      <text x="34" y="108" font-family="'JetBrains Mono',monospace" font-size="12.5" font-weight="bold" fill="#10b981" class="rname">POSTURE-ANALYSIS-SYSTEM</text>
      <text x="295" y="108" font-family="'JetBrains Mono',monospace" font-size="11" fill="#94A3B8">Real-time CV posture &amp; joint angle pipeline</text>
      <rect x="650" y="93" width="54" height="16" rx="8" fill="#0a1f14" stroke="rgba(16,185,129,0.4)" stroke-width="1"/>
      <text x="677" y="105" text-anchor="middle" font-family="'JetBrains Mono',monospace" font-size="8.5" fill="#34d399">Python</text>
      <rect x="710" y="93" width="60" height="16" rx="8" fill="#0a1f14" stroke="rgba(16,185,129,0.3)" stroke-width="1"/>
      <text x="740" y="105" text-anchor="middle" font-family="'JetBrains Mono',monospace" font-size="8.5" fill="#34d399">OpenCV</text>
      <rect x="776" y="93" width="62" height="16" rx="8" fill="#0a1f14" stroke="rgba(16,185,129,0.3)" stroke-width="1"/>
      <text x="807" y="105" text-anchor="middle" font-family="'JetBrains Mono',monospace" font-size="8.5" fill="#6ee7b7">MediaPipe</text>
      <text class="arrow" x="854" y="108" font-family="'JetBrains Mono',monospace" font-size="13" fill="#475569">↗</text>
    </a>

    <!-- Project 2 -->
    <a href="https://github.com/SakshamSuper/AI-physio-analysis" target="_blank" class="row">
      <rect class="rbg" x="18" y="128" width="852" height="38" rx="6" fill="#07101e" fill-opacity="0.7" stroke="rgba(255,255,255,0.05)" stroke-width="1"/>
      <text x="34" y="152" font-family="'JetBrains Mono',monospace" font-size="12.5" font-weight="bold" fill="#10b981" class="rname">AI-physio-analysis</text>
      <text x="295" y="152" font-family="'JetBrains Mono',monospace" font-size="11" fill="#94A3B8">CV action classifier for physiotherapy sessions</text>
      <rect x="650" y="137" width="54" height="16" rx="8" fill="#0a1f14" stroke="rgba(16,185,129,0.4)" stroke-width="1"/>
      <text x="677" y="149" text-anchor="middle" font-family="'JetBrains Mono',monospace" font-size="8.5" fill="#34d399">Python</text>
      <rect x="710" y="137" width="68" height="16" rx="8" fill="#0a1f14" stroke="rgba(16,185,129,0.3)" stroke-width="1"/>
      <text x="744" y="149" text-anchor="middle" font-family="'JetBrains Mono',monospace" font-size="8.5" fill="#34d399">TensorFlow</text>
      <rect x="784" y="137" width="52" height="16" rx="8" fill="#0a1f14" stroke="rgba(16,185,129,0.3)" stroke-width="1"/>
      <text x="810" y="149" text-anchor="middle" font-family="'JetBrains Mono',monospace" font-size="8.5" fill="#6ee7b7">YOLO</text>
      <text class="arrow" x="854" y="152" font-family="'JetBrains Mono',monospace" font-size="13" fill="#475569">↗</text>
    </a>

    <!-- Project 3 -->
    <a href="https://github.com/SakshamSuper/CRYPTO_PRICE_ANALYSIS" target="_blank" class="row">
      <rect class="rbg" x="18" y="172" width="852" height="38" rx="6" fill="#07101e" fill-opacity="0.7" stroke="rgba(255,255,255,0.05)" stroke-width="1"/>
      <text x="34" y="196" font-family="'JetBrains Mono',monospace" font-size="12.5" font-weight="bold" fill="#10b981" class="rname">CRYPTO_PRICE_ANALYSIS</text>
      <text x="295" y="196" font-family="'JetBrains Mono',monospace" font-size="11" fill="#94A3B8">Time-series ML forecasting for crypto markets</text>
      <rect x="650" y="181" width="54" height="16" rx="8" fill="#0a1f14" stroke="rgba(16,185,129,0.4)" stroke-width="1"/>
      <text x="677" y="193" text-anchor="middle" font-family="'JetBrains Mono',monospace" font-size="8.5" fill="#34d399">Python</text>
      <rect x="710" y="181" width="52" height="16" rx="8" fill="#0a1f14" stroke="rgba(16,185,129,0.3)" stroke-width="1"/>
      <text x="736" y="193" text-anchor="middle" font-family="'JetBrains Mono',monospace" font-size="8.5" fill="#34d399">LSTM</text>
      <rect x="768" y="181" width="68" height="16" rx="8" fill="#0a1f14" stroke="rgba(16,185,129,0.3)" stroke-width="1"/>
      <text x="802" y="193" text-anchor="middle" font-family="'JetBrains Mono',monospace" font-size="8.5" fill="#6ee7b7">Pandas/MPL</text>
      <text class="arrow" x="854" y="196" font-family="'JetBrains Mono',monospace" font-size="13" fill="#475569">↗</text>
    </a>

    <!-- Project 4 -->
    <a href="https://github.com/SakshamSuper/portfolio" target="_blank" class="row">
      <rect class="rbg" x="18" y="216" width="852" height="38" rx="6" fill="#07101e" fill-opacity="0.7" stroke="rgba(255,255,255,0.05)" stroke-width="1"/>
      <text x="34" y="240" font-family="'JetBrains Mono',monospace" font-size="12.5" font-weight="bold" fill="#10b981" class="rname">portfolio</text>
      <text x="295" y="240" font-family="'JetBrains Mono',monospace" font-size="11" fill="#94A3B8">Premium dark editorial portfolio UI/UX</text>
      <rect x="650" y="225" width="52" height="16" rx="8" fill="#0a1f14" stroke="rgba(16,185,129,0.4)" stroke-width="1"/>
      <text x="676" y="237" text-anchor="middle" font-family="'JetBrains Mono',monospace" font-size="8.5" fill="#34d399">Next.js</text>
      <rect x="708" y="225" width="60" height="16" rx="8" fill="#0a1f14" stroke="rgba(16,185,129,0.3)" stroke-width="1"/>
      <text x="738" y="237" text-anchor="middle" font-family="'JetBrains Mono',monospace" font-size="8.5" fill="#34d399">Tailwind</text>
      <rect x="774" y="225" width="60" height="16" rx="8" fill="#0a1f14" stroke="rgba(16,185,129,0.3)" stroke-width="1"/>
      <text x="804" y="237" text-anchor="middle" font-family="'JetBrains Mono',monospace" font-size="8.5" fill="#6ee7b7">Vercel</text>
      <text class="arrow" x="854" y="240" font-family="'JetBrains Mono',monospace" font-size="13" fill="#475569">↗</text>
    </a>

    <!-- Footer -->
    <line x1="18" y1="264" x2="870" y2="264" stroke="rgba(255,255,255,0.05)" stroke-width="1"/>
    <text x="25" y="290" font-family="'JetBrains Mono',monospace" font-size="10" fill="#374151">● main</text>
    <text x="130" y="290" font-family="'JetBrains Mono',monospace" font-size="10" fill="#10b981">■ Python</text>
    <text x="230" y="290" font-family="'JetBrains Mono',monospace" font-size="10" fill="#f59e0b">■ ML / CV</text>
    <text x="340" y="290" font-family="'JetBrains Mono',monospace" font-size="10" fill="#38bdf8">■ Full-Stack</text>
    <text x="862" y="290" text-anchor="end" font-family="'JetBrains Mono',monospace" font-size="10" fill="#374151">4 featured repos // click row to navigate</text>
    <!-- Cursor blink -->
    <text x="25" y="318" font-family="'JetBrains Mono',monospace" font-size="13" font-weight="bold" fill="#00D4FF">❯</text>
    <rect x="43" y="305" width="9" height="16" rx="1" fill="#00D4FF">
      <animate attributeName="opacity" values="1;0;1" dur="1.1s" repeatCount="indefinite"/>
    </rect>
  </g>
</svg>
