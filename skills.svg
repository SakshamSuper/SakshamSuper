      <stop offset="100%" stop-color="rgba(139,92,246,0.25)"/>
    </linearGradient>
    <clipPath id="sk-clip"><rect width="920" height="130" rx="10"/></clipPath>
  </defs>
  <style>
    .chip { transition: all 0.2s; }
  </style>

