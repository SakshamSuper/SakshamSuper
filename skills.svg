<svg xmlns="http://www.w3.org/2000/svg" width="920" height="130" viewBox="0 0 920 130" font-family="-apple-system,BlinkMacSystemFont,'JetBrains Mono','Segoe UI',sans-serif">
  <defs>
    <linearGradient id="sk-bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#070b15"/>
      <stop offset="100%" stop-color="#030509"/>
    </linearGradient>
    <linearGradient id="sk-hdr" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#070b14"/>
